<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubaKon.ru</title>
    <!-- Подключаем красивый шрифт Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Подключаем Font Awesome для иконок соцсетей -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Сбрасываем отступы и задаём общий стиль */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Карточка визитки */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        /* Аватар / фото */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        /* Можно использовать заглушку, если нет фото */
        .avatar-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 48px;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .title {
            font-size: 18px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
            font-size: 16px;
        }

        /* Контактная информация */
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #555;
            font-size: 16px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .contact-item i {
            width: 20px;
            color: #667eea;
            font-size: 18px;
        }

        .contact-item:hover {
            color: #667eea;
        }

        /* Социальные сети */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .social-links a {
            color: #667eea;
            font-size: 24px;
            transition: all 0.3s;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(102, 126, 234, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .social-links a:hover {
            background: #667eea;
            color: white;
            transform: scale(1.1);
        }

        /* Кнопка действия */
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 35px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            margin-top: 25px;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            transition: all 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        /* Для мобильных */
        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Здесь можно использовать либо фото, либо заглушку с инициалами -->
        <img src="image.jpg" alt="Аватар" class="avatar">
        
        <!-- Заглушка с инициалами (например, "JD") 
        <div class="avatar-placeholder">JD</div> -->

        <h1>Валерий SubaKon</h1>
        <div class="title">Стример-энтузиаст</div>
        <p class="description">
            Страдаю разной фигней в виде хобби. 
            Показываю разную фигню на стримах.
        </p>

        <!-- Контакты -->
        <div class="contact-info">
            <a href="mailto:admin@subakon.ru" class="contact-item">
                <i class="fas fa-envelope"></i>
                <span>admin@subakon.ru</span>
            </a>
            <a href="https://t.me/+K9RVZPAm8oVlYTVi" class="contact-item" target="_blank">
                <i class="fab fa-telegram"></i>
                <span>@Обитель Шубы</span>
            </a>
            <div class="contact-item">
                <i class="fas fa-map-marker-alt"></i>
                <span>Где-то на просторах интернета</span>
            </div>
        </div>

        <!-- Соцсети -->
        <div class="social-links">
            <a href="https://github.com/SubaKon" target="_blank"><i class="fab fa-github"></i></a>
            <a href="#" target="_blank"><i class="fab fa-discord"></i></a>
            <a href="https://www.twitch.tv/subakon" target="_blank"><i class="fab fa-twitch"></i></a>
			<a href="https://youtube.com/@SubaKon" target="_blank"><i class="fab fa-youtube"></i></a>
        </div>

        <!-- Кнопка (например, ссылка на портфолио) -->
        <!-- <a href="#" class="btn">Мой сайт</a> -->
    </div>
</body>
</html>
