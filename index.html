<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubaKon.ru</title>
    <!-- Подключаем красивый шрифт Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Подключаем Font Awesome для иконок соцсетей -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Сбрасываем отступы и задаём общий стиль */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Карточка визитки (растянутая: слева видео, справа визитка) */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1.25fr 1fr;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        /* Левая часть с видео */
        .video-side {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 420px;
            overflow: hidden;
        }

        .rick-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Правая часть с оригинальной визиткой */
        .profile-side {
            padding: 40px 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Аватар / фото */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        /* Можно использовать заглушку, если нет фото */
        .avatar-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 48px;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .title {
            font-size: 18px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
            font-size: 16px;
        }

        /* Контактная информация */
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #555;
            font-size: 16px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .contact-item i {
            width: 20px;
            color: #667eea;
            font-size: 18px;
        }

        .contact-item:hover {
            color: #667eea;
        }

        /* Социальные сети */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .social-links a {
            color: #667eea;
            font-size: 24px;
            transition: all 0.3s;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(102, 126, 234, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .social-links a:hover {
            background: #667eea;
            color: white;
            transform: scale(1.1);
        }

        /* Кнопка действия */
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 35px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            margin-top: 25px;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            transition: all 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        /* Для мобильных */
        @media (max-width: 768px) {
            .card {
                grid-template-columns: 1fr;
                max-width: 400px;
            }

            .video-side {
                min-height: 240px;
            }

            .profile-side {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Левая часть с автозапуском видео -->
        <div class="video-side">
            <video id="rickVideo" class="rick-video" autoplay loop playsinline controls></video>
        </div>

        <!-- Правая часть (оригинальная визитка без изменений) -->
        <div class="profile-side">
            <!-- Здесь можно использовать либо фото, либо заглушку с инициалами -->
            <img id="avatarImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Аватар" class="avatar">
            
            <!-- Заглушка с инициалами (например, "JD") 
            <div class="avatar-placeholder">JD</div> -->

            <h1>Валерий SubaKon</h1>
            <div class="title">Стример-энтузиаст</div>
            <p class="description">
                Страдаю разной фигней в виде хобби. 
                Показываю разную фигню на стримах.
            </p>

            <!-- Контакты -->
            <div class="contact-info">
                <a href="mailto:admin@subakon.ru" class="contact-item">
                    <i class="fas fa-envelope"></i>
                    <span>admin@subakon.ru</span>
                </a>
                <a href="https://t.me/+K9RVZPAm8oVlYTVi" class="contact-item" target="_blank">
                    <i class="fab fa-telegram"></i>
                    <span>@Обитель Шубы</span>
                </a>
                <div class="contact-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>Где-то на просторах интернета</span>
                </div>
            </div>

            <!-- Соцсети -->
            <div class="social-links">
                <a href="https://github.com/SubaKon" target="_blank"><i class="fab fa-github"></i></a>
                <a href="https://discord.com" target="_blank"><i class="fab fa-discord"></i></a>
                <a href="https://www.twitch.tv/subakon" target="_blank"><i class="fab fa-twitch"></i></a>
                <a href="https://youtube.com/@SubaKon" target="_blank"><i class="fab fa-youtube"></i></a>
            </div>

            <!-- Кнопка (например, ссылка на портфолио) -->
            <!-- <a href="#" class="btn">Мой сайт</a> -->
        </div>
    </div>

<script>
        (function() {
            // Путь к вашему 21 МБ видеофайлу (или прямая ссылка с WebArchive) и аватарке
            const VIDEO_URL = 'rickroll.mp4';
            const AVATAR_URL = 'image.jpg';

            const video = document.getElementById('rickVideo');
            const avatar = document.getElementById('avatarImg');

            avatar.src = AVATAR_URL;
            video.src = VIDEO_URL;

            // 1. Пробуем запустить сразу со звуком при открытии страницы
            window.addEventListener('DOMContentLoaded', () => {
                video.muted = false;
                video.volume = 1.0;

                const playPromise = video.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(() => {
                        // Если браузер заблокировал автозапуск со звуком — запускаем без звука, чтобы видео не стояло на паузе
                        video.muted = true;
                        video.play().catch(() => {});
                    });
                }
            });

            // 2. Включаем звук при первом же клике, тапе или нажатии клавиши
            const unlockSound = () => {
                if (video.muted) {
                    video.muted = false;
                    video.volume = 1.0;
                    video.play().catch(() => {});
                }
            };

            ['click', 'touchstart', 'keydown'].forEach(evt => {
                document.addEventListener(evt, unlockSound, { once: true });
            });
        })();
    </script>
</body>
</html>
